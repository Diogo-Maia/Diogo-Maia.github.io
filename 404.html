<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found — Diogo Maia</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#080b12" />
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/css/style.css" />
<style>
  .nf { position: relative; min-height: 100vh; display: grid; place-items: center; text-align: center; overflow: hidden; }
  .nf .code {
    font-family: var(--display);
    font-size: clamp(4.5rem, 17vw, 10rem); font-weight: 800; letter-spacing: -.05em;
    /* same background-clip:text rule as the hero name - the box must fit the glyphs */
    line-height: 1.08; padding: .06em .04em .24em 0; margin-bottom: -.2em;
    background: linear-gradient(140deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .nf h1 { margin-top: 18px; font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 700; }
  .nf p { margin-top: 12px; color: var(--ink-mute); }
</style>
</head>
<body>
  <main class="nf">
    <div class="aurora" aria-hidden="true"></div>
    <div class="shell" style="position:relative;z-index:1">
      <p class="code">404</p>
      <h1>This page doesn't exist.</h1>
      <p>The link may be outdated, or the page has moved.</p>
      <div class="hero-actions centered"><a class="btn btn-solid" href="/">Back to home</a></div>
    </div>
  </main>
</body>
</html>
